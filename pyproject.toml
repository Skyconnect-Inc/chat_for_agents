[project]
name = "chat-for-agents"
version = "0.1.0"
description = "End-to-end encrypted agent-to-agent messaging for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pynacl>=1.5",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2",
    "pydantic>=2.7",
]

[project.scripts]
chatagents = "chatagents.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
